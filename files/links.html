    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
        }

        body {
            min-height: 100%;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 30px;
            overflow-x: hidden;
        }

        /* ── Fundo com partículas douradas ── */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(212,175,55,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(212,175,55,0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(212,175,55,0.3), 0 0 40px rgba(212,175,55,0.1); }
            50% { box-shadow: 0 0 30px rgba(212,175,55,0.5), 0 0 60px rgba(212,175,55,0.2); }
        }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        /* ── Avatar ── */
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            font-size: 2.2rem;
            font-weight: 700;
            color: #d4af37;
            letter-spacing: 2px;
            animation: pulseGlow 3s ease-in-out infinite;
            margin-bottom: 16px;
        }

        /* ── Nome e subtítulo ── */
        .name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 1rem;
            color: #d4af37;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .views {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 32px;
        }

        /* ── Links ── */
        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .link-btn:focus-visible {
            outline: 2px solid #d4af37;
            outline-offset: 3px;
        }

        /* Botão destaque (EventCalc grátis) */
        .link-btn.destaque {
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            color: #0a0a0a;
            font-size: 1.05rem;
            padding: 18px 20px;
            box-shadow: 0 4px 20px rgba(212,175,55,0.35);
        }

        .link-btn.destaque::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255,255,255,0.2) 50%,
                transparent 100%
            );
            background-size: 200% 100%;
            animation: shimmer 3s ease-in-out infinite;
        }

        .link-btn.destaque:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(212,175,55,0.5);
        }

        .link-btn.destaque:active {
            transform: translateY(0);
        }

        /* Botões normais */
        .link-btn.normal {
            background: rgba(255,255,255,0.06);
            color: #f0f0f0;
            border: 1px solid rgba(212,175,55,0.2);
        }

        .link-btn.normal:hover {
            background: rgba(212,175,55,0.12);
            border-color: rgba(212,175,55,0.5);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212,175,55,0.15);
        }

        .link-btn.normal:active {
            transform: translateY(0);
        }

        /* Botão WhatsApp */
        .link-btn.whatsapp {
            background: rgba(37,211,102,0.1);
            color: #f0f0f0;
            border: 1px solid rgba(37,211,102,0.25);
        }

        .link-btn.whatsapp:hover {
            background: rgba(37,211,102,0.2);
            border-color: rgba(37,211,102,0.5);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(37,211,102,0.15);
        }

        .link-btn.whatsapp:active {
            transform: translateY(0);
        }

        /* ── Ícone do botão ── */
        .btn-icon {
            font-size: 1.2em;
            flex-shrink: 0;
        }

        .btn-text {
            position: relative;
            z-index: 1;
        }

        /* ── Separador ── */
        .separator {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212,175,55,0.4), transparent);
            margin: 28px 0;
        }

        /* ── Redes sociais ── */
        .social {
            display: flex;
            gap: 16px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .social a {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(212,175,55,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social a:hover {
            background: rgba(212,175,55,0.15);
            border-color: rgba(212,175,55,0.5);
            transform: translateY(-2px);
        }

        .social a:focus-visible {
            outline: 2px solid #d4af37;
            outline-offset: 3px;
        }

        .social svg {
            width: 20px;
            height: 20px;
            fill: #d4af37;
        }

        /* ── Footer ── */
        footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #555;
            text-align: center;
        }

        footer a {
            color: #777;
            text-decoration: none;
        }

        footer a:hover {
            color: #d4af37;
        }

        /* ── Animação escalonada dos botões ── */
        .link-btn:nth-child(1) { animation: fadeInUp 0.6s ease-out 0.1s both; }
        .link-btn:nth-child(2) { animation: fadeInUp 0.6s ease-out 0.2s both; }
        .link-btn:nth-child(3) { animation: fadeInUp 0.6s ease-out 0.3s both; }
        .link-btn:nth-child(4) { animation: fadeInUp 0.6s ease-out 0.4s both; }
